<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เมนูระบบ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fdf2f8; --card:#fff; --text:#1e293b; --muted:#64748b; --accent:#db2777; --border:#fbcfe8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1420; --card:#261c2e; --text:#f1f5f9; --muted:#a8a3b3; --accent:#f472b6; --border:#4a3355; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Sarabun',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .wrap { max-width:960px; margin:0 auto; padding:32px 16px 48px; }
  h1 { margin:0 0 4px; font-size:1.6rem; color:var(--accent); }
  .sub { margin:0 0 20px; color:var(--muted); font-size:.95rem; }
  #q { width:100%; padding:12px 14px; font:inherit; border:1px solid var(--border); border-radius:12px; background:var(--card); color:var(--text); margin-bottom:18px; }
  #q:focus { outline:2px solid var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  a.card { display:flex; gap:14px; align-items:flex-start; padding:16px; background:var(--card); border:1px solid var(--border); border-radius:14px; text-decoration:none; color:inherit; transition:transform .12s, box-shadow .12s; }
  a.card:hover, a.card:focus-visible { transform:translateY(-2px); box-shadow:0 6px 18px rgba(219,39,119,.18); outline:none; }
  .ico { font-size:1.9rem; line-height:1; }
  .t { font-weight:700; }
  .d { color:var(--muted); font-size:.85rem; margin-top:2px; word-break:break-all; }
  .tag { display:inline-block; margin-top:6px; font-size:.7rem; padding:1px 8px; border-radius:99px; background:var(--border); color:var(--text); }
  #status { margin-top:16px; color:var(--muted); font-size:.8rem; }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:32px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <input id="q" type="search" placeholder="ค้นหาเมนู..." autocomplete="off" aria-label="ค้นหาเมนู">
  <div class="grid" id="grid"></div>
  <div id="status"></div>
</div>

<script>
/* =================== ตั้งค่า (แก้เฉพาะส่วนนี้) =================== */
const SITE_TITLE    = 'ระบบยอดเตียงโรงพยาบาล';
const SITE_SUBTITLE = 'เลือกระบบที่ต้องการใช้งาน';

// รายการเมนูที่กำหนดเอง (แสดงก่อนเสมอ) — href ใช้ path แบบสัมพัทธ์ ไม่ต้องขึ้นต้นด้วย /
const MANUAL_ITEMS = [
  { title: 'หอผู้ป่วย (Ward)', desc: 'บันทึกยอดเตียงรายหน่วย/รายเวร และดูข้อมูลย้อนหลัง', href: 'ward.html', icon: '🛏️' },
  { title: 'หัวหน้าเวร (Supervisor)', desc: 'สำหรับหัวหน้าเวร/ผู้นิเทศ', href: 'supervisor.html', icon: '👩‍⚕️' },
];

// ค้นหาไฟล์ .html ในรากของ repo แล้วเพิ่มเป็นเมนูให้อัตโนมัติ (ใช้ GitHub API)
const AUTO_DISCOVER = false;           // เปลี่ยนเป็น true ถ้าต้องการ
const EXCLUDE = ['index.html', '404.html'];   // ไฟล์ที่ไม่ต้องแสดง
const REPO = { owner: '', repo: '', branch: '' };  // เว้นว่าง = เดาจาก URL ของ GitHub Pages
/* ================================================================ */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
let items = MANUAL_ITEMS.map(i => ({ ...i, auto: false }));

document.title = SITE_TITLE;
$('title').textContent = SITE_TITLE;
$('subtitle').textContent = SITE_SUBTITLE;

function render() {
  const q = $('q').value.trim().toLowerCase();
  const list = items.filter(i => (i.title + ' ' + (i.desc || '') + ' ' + i.href).toLowerCase().includes(q));
  $('grid').innerHTML = list.length ? list.map(i => `
    <a class="card" href="${esc(i.href)}">
      <div class="ico">${esc(i.icon || '📄')}</div>
      <div><div class="t">${esc(i.title)}</div>
      <div class="d">${esc(i.desc || i.href)}</div>
      ${i.auto ? '<span class="tag">พบอัตโนมัติ</span>' : ''}</div>
    </a>`).join('') : '<div class="empty">ไม่พบเมนูที่ค้นหา</div>';
}

function guessRepo() {
  let { owner, repo } = REPO;
  const host = location.hostname;
  if (!owner && host.endsWith('.github.io')) owner = host.split('.')[0];
  if (!repo && owner) repo = location.pathname.split('/')[1] || (owner + '.github.io');
  return { owner, repo };
}

async function discover() {
  const { owner, repo } = guessRepo();
  if (!owner || !repo) { $('status').textContent = 'ไม่สามารถระบุ repo อัตโนมัติได้ (แสดงเฉพาะเมนูที่กำหนดเอง)'; return; }
  const cacheKey = 'menu_files_' + owner + '/' + repo;
  let files = null;
  try {                                   // แคช 10 นาที กันเรียก API ถี่เกินโควตา (60 ครั้ง/ชม./IP)
    const c = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (c && Date.now() - c.t < 600000) files = c.files;
  } catch (e) {}
  try {
    if (!files) {
      const url = `https://api.github.com/repos/${owner}/${repo}/contents/` + (REPO.branch ? `?ref=${encodeURIComponent(REPO.branch)}` : '');
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      files = (await res.json()).filter(f => f.type === 'file' && /\.html?$/i.test(f.name)).map(f => f.name);
      try { localStorage.setItem(cacheKey, JSON.stringify({ t: Date.now(), files })); } catch (e) {}
    }
    const known = new Set(items.map(i => decodeURIComponent(i.href.split('?')[0])));
    files.filter(n => !EXCLUDE.includes(n) && !known.has(n)).sort().forEach(n => items.push({
      title: n.replace(/\.html?$/i, '').replace(/[-_]+/g, ' '),
      desc: n, href: encodeURIComponent(n), icon: '📄', auto: true
    }));
    render();
  } catch (e) {
    $('status').textContent = 'ค้นหาไฟล์อัตโนมัติไม่สำเร็จ (อาจเกินโควตา API) — แสดงเฉพาะเมนูที่กำหนดเอง';
  }
}

$('q').addEventListener('input', render);
render();
if (AUTO_DISCOVER) discover();
</script>
</body>
</html>
